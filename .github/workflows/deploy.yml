
name: Build and Deploy Website to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          grep -q "CI/CD Deployment Successful" index.html
          echo "Website tests passed"

      - name: Build website
        run: |
          mkdir dist
          cp index.html style.css script.js dist/
          cd dist
          zip -r ../website-build.zip .
      
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website-build.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy website to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/ --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
