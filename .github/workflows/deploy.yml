
name: Deploy Website to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          grep -q "CI/CD Deployment Successful" index.html
          echo "Website file checks passed"

      - name: Build website
        run: |
          mkdir dist
          cp index.html style.css script.js dist/
          cd dist
          zip -r ../website-build.zip .
          echo "Website build completed"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: website-build.zip
