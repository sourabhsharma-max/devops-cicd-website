
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps CI/CD Website</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="tag">DEVOPS FUNDAMENTALS</p>
    <h1>CI/CD Deployment Successful!</h1>
    <p class="description">
      This website is deployed automatically using GitHub Actions,
      Amazon S3, and CloudFront.
    </p>

    <div class="status">
      <span class="dot"></span>
      Deployment Status: Active
    </div>

    <p id="version">Version 1.0</p>
    <button id="checkButton">Verify Website</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
